<link rel="stylesheet" href="styles.css?v=20261020b" />
<script>
/* 转场幕布：必须在首帧前决定是否铺开，否则会闪一下白屏 */
(function () {
  try {
    var raw = sessionStorage.getItem('mmw-transition');
    if (!raw) return;
    sessionStorage.removeItem('mmw-transition');
    var d = JSON.parse(raw) || {};
    var root = document.documentElement;
    if (d.fill) root.style.setProperty('--pt-fill', d.fill);
    if (d.rect) {                       /* 返回：幕布收缩回这一格 */
      root.style.setProperty('--pt-tx', d.rect.x + 'px');
      root.style.setProperty('--pt-ty', d.rect.y + 'px');
      root.style.setProperty('--pt-sx', (d.rect.w / window.innerWidth).toFixed(5));
      root.style.setProperty('--pt-sy', (d.rect.h / window.innerHeight).toFixed(5));
      root.setAttribute('data-pt-shrink', '1');
    }
    root.classList.add('is-entering');
  } catch (e) {}
})();
</script>
</head>
<body>
  <div class="pt-curtain" aria-hidden="true"></div>

  <div class="page">
    <header class="masthead">
      <h1 class="round">
        <span class="m-line">会计准则</span>
        <span class="m-line"><span class="m-mark">妙妙屋</span></span>
      </h1>
    </header>

    <main class="scene" id="scene" aria-label="准则列表">
      <div class="scene-plane bento" id="plane"></div>
    </main>
  <p class="scene-hint" id="hint">移动鼠标看视差　·　点卡片放大，再点卡片上的按钮进入</p>

    <p class="colophon">
      七条准则里，目前整理好了「资产减值」这一条。<br />
      其余六条点开会告诉你进度。
    </p>
  </div>

  <!-- 遮罩放最外层：.scene 有 perspective，会成为 position:fixed 后代的包含块 -->
  <div class="scene-veil" id="veil" hidden></div>

  <script src="common.js?v=20261020b"></script>
  <script src="app.js?v=20261020b"></script>
</body>

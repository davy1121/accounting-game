<link rel="stylesheet" href="styles.css?v=20261020c" />
<script>
/* 转场幕布：必须在首帧前决定是否铺开，否则会闪一下白屏 */
(function () {
  try {
    var raw = sessionStorage.getItem('mmw-transition');
    if (!raw) return;
    sessionStorage.removeItem('mmw-transition');
    var d = JSON.parse(raw) || {};
    var root = document.documentElement;
    if (d.fill) root.style.setProperty('--pt-fill', d.fill);
    if (d.rect) {
      root.style.setProperty('--pt-tx', d.rect.x + 'px');
      root.style.setProperty('--pt-ty', d.rect.y + 'px');
      root.style.setProperty('--pt-sx', (d.rect.w / window.innerWidth).toFixed(5));
      root.style.setProperty('--pt-sy', (d.rect.h / window.innerHeight).toFixed(5));
      root.setAttribute('data-pt-shrink', '1');
    }
    root.classList.add('is-entering');
  } catch (e) {}
})();
</script>

  <div class="pt-curtain" aria-hidden="true"></div>

    <p class="scene-hint" id="hint">移动鼠标看视差　·　点卡片放大，再点卡片上的按钮打开</p>

    <p class="colophon">
      课件、案例视频、趣味游戏都已就绪。
    </p>
  </div>

  <!-- 遮罩放在最外层：.scene 有 perspective、.page 转场时会加 transform，

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>会计准则妙妙屋 · 学生端</title>
<link rel="stylesheet" href="三贤者.css?v=20261020a" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login { width: 100%; max-width: 430px; background: #fff; border: 2.5px solid #101418;
           border-radius: 24px; box-shadow: 6px 6px 0 #101418; padding: 32px 26px 26px; }
  .login h1 { font-size: 26px; margin: 0 0 8px; }
  .login .sub { font-size: 14px; color: #6B7683; margin: 0 0 22px; line-height: 1.75; }
  .login label { display: block; font-size: 13px; font-weight: 700; color: #101418; margin-bottom: 9px; }
  .login input {
    width: 100%; box-sizing: border-box; padding: 15px 18px; font-size: 19px; font-family: inherit;
    border: 2px solid #E3E8EE; border-radius: 14px; outline: none; transition: border-color .15s, box-shadow .15s;
    letter-spacing: .02em; -webkit-appearance: none;
  }
  .login input:focus { border-color: #101418; box-shadow: 3px 3px 0 #101418; }
  .login button {
    width: 100%; margin-top: 18px; padding: 16px; font-size: 17px; font-weight: 800; font-family: inherit;
    color: #fff; background: #101418; border: 0; border-radius: 999px; cursor: pointer;
    transition: transform .15s, background .15s;
  }
  .login button:hover { transform: translateY(-2px); background: #0F6CBF; }
  .err { margin: 12px 0 0; font-size: 13.5px; color: #C21E63; min-height: 20px; line-height: 1.6; }
  .who { margin-top: 14px; font-size: 13px; color: #6B7683; text-align: center; }
  .who b { color: #101418; }
  .tip { margin-top: 14px; font-size: 12px; color: #8A93A0; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<form class="login" id="f">
  <p style="font-size:12px;letter-spacing:.16em;color:#6B7683;margin:0 0 10px">会计准则妙妙屋</p>
  <h1>输入你的姓名</h1>
  <p class="sub">姓名或学号都行，用来统计成绩排名。<br/>输完直接进入游戏。</p>
  <label for="who">姓名 / 学号</label>
  <input id="who" name="who" type="text" autocomplete="off" placeholder="例如 张三 或 12026201210" maxlength="20" required />
  <button type="submit" id="go">开始游戏 →</button>
  <p class="err" id="err"></p>
  <p class="who" id="last" hidden></p>
  <p class="tip">姓名不在名单里时，请改输学号</p>
</form>
<script>
var NAMES = ["李继次", "贾传文", "徐皓然", "王昕圆", "董馨怡", "钟金坤", "李菁菁", "秦月", "邓惊涛", "毛燕", "张莹", "翟红倩", "吴嘉仪", "盛建邦", "许子悦", "刘淑雯", "李果果", "杨紫淳", "吴敏厚", "秦双双", "杨思诗", "高怡", "苏宁", "陆睿珏", "吴颖欣", "王煜栋", "张新驰", "林蔓君", "陈寒玉", "马和禄", "唐鑫玉", "孟雨宸", "宋秉航", "宋欣怡", "杨何思", "刘丹", "田涛", "王思贤", "吕应维", "杨文欣", "程丹", "胡奉瑜", "梁慧聪", "于嘉琪", "虢姝含", "傅泽鑫", "陈梦雨", "肖旨宇", "王小平", "王华婧"];
var ID_MIN = 12026201210, ID_MAX = 12026201260;

(function () {
  var f = document.getElementById('f'), inp = document.getElementById('who'),
      err = document.getElementById('err'), last = document.getElementById('last');
  var saved = localStorage.getItem('studentId');
  if (saved) {
    last.hidden = false;
    last.innerHTML = '上次用的：<b>' + saved + '</b>';
    inp.value = saved;
  }
  function isId(v) { return /^\d{11}$/.test(v) && +v >= ID_MIN && +v <= ID_MAX; }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = inp.value.trim().replace(/\s+/g, '');
    if (!v) { err.textContent = '请输入姓名或学号'; return; }
    if (NAMES.indexOf(v) === -1 && !isId(v)) {
      err.textContent = NAMES.length && v.length <= 5
        ? '名单里没有「' + v + '」，请核对姓名；也可以改输 11 位学号'
        : '请输 11 位学号（' + ID_MIN + ' ~ ' + ID_MAX + '）';
      return;
    }
    err.textContent = '';
    localStorage.setItem('studentId', v);
    localStorage.removeItem('sxz');
    sessionStorage.removeItem('heartUsed');
    location.href = '三贤者.html?sid=' + encodeURIComponent(v);
  });
})();
</script>
</body>
</html>
